name: hitung_banter_app
description: "Aplikasi Android Flutter WebView untuk HITUNG BANTER - Kalkulator & Pembukuan Keuangan Driver BANTER."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.7.0
  connectivity_plus: ^5.0.2
  url_launcher: ^6.2.5
  permission_handler: ^11.3.0
  flutter_spinkit: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
